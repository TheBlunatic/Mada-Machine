<controls>
    <control Name="escape">
        <keybind Key="Escape" Modifier="None" />
    </control>
    <control Name="vision">
        <keybind Key="V" Modifier="None" />
    </control>
    <control Name="reveal all">
        <keybind Key="V" Modifier="Shift" />
    </control>

    <control Name="navigate back">
        <keybind Key="Back" Modifier="None" />
        <keybind Key="Left" Modifier="None" />
    </control>
    <control Name="navigate forwards">
        <keybind Key="Enter" Modifier="None" />
        <keybind Key="Right" Modifier="None" />
    </control>
    <control Name="navigate down">
        <keybind Key="Down" Modifier="None" />
    </control>
    <control Name="navigate up">
        <keybind Key="Up" Modifier="None" />
    </control>

    <control Name="move left">
        <keybind Key="Left" Modifier="Any" />
    </control>
    <control Name="move right">
        <keybind Key="Right" Modifier="Any" />
    </control>
    <control Name="move up">
        <keybind Key="Up" Modifier="Any" />
    </control>
    <control Name="move down">
        <keybind Key="Down" Modifier="Any" />
    </control>

    <control Name="save">
        <keybind Key="S" Modifier="Ctrl" />
    </control>
    <control Name="open">
        <keybind Key="O" Modifier="Ctrl" />
    </control>
    <control Name="undo">
        <keybind Key="Z" Modifier="Ctrl" />
    </control>
    <control Name="redo">
        <keybind Key="Y" Modifier="Ctrl" />
    </control>

    <control Name="select all">
        <keybind Key="A" Modifier="Ctrl" />
    </control>
    <control Name="delete">
        <keybind Key="Delete" Modifier="None" />
    </control>

    <control Name="show mask">
        <keybind Key="M" Modifier="Ctrl" />
    </control>

    <control Name="rotate clockwise">
        <keybind Key="R" Modifier="None" />
    </control>
    <control Name="rotate anticlockwise">
        <keybind Key="R" Modifier="Shift" />
    </control>
    <control Name="rotate fully">
        <keybind Key="R" Modifier="Ctrl" />
    </control>
    <control Name="flip horizontally">
        <keybind Key="H" Modifier="None" />
    </control>
    <control Name="flip vertically">
        <keybind Key="V" Modifier="None" />
    </control>
</controls>
