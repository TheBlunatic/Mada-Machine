<controls>
    <control Name="escape">
        <keybind Key="Escape" Modifier="None" />
    </control>

    <control Name="navigate back">
        <keybind Key="Back" Modifier="None" />
        <keybind Key="Left" Modifier="None" />
    </control>
    <control Name="navigate forwards">
        <keybind Key="Enter" Modifier="None" />
        <keybind Key="Right" Modifier="None" />
    </control>
    <control Name="navigate down">
        <keybind Key="Down" Modifier="None" />
    </control>
    <control Name="navigate up">
        <keybind Key="Up" Modifier="None" />
    </control>

    <control Name="load program">
        <keybind Key="L" Modifier="Ctrl" />
    </control>
    <control Name="toggle machine code">
        <keybind Key="T" Modifier="Ctrl" />
    </control>
</controls>
