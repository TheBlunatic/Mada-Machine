<controls>
    <control Name="escape">
        <keybind Key="Escape" Modifier="None" />
    </control>

    <control Name="navigate back">
        <keybind Key="Back" Modifier="None" />
        <keybind Key="Left" Modifier="None" />
    </control>
    <control Name="navigate forwards">
        <keybind Key="Enter" Modifier="None" />
        <keybind Key="Right" Modifier="None" />
    </control>
    <control Name="navigate down">
        <keybind Key="Down" Modifier="None" />
    </control>
    <control Name="navigate up">
        <keybind Key="Up" Modifier="None" />
    </control>

    <control Name="toggle machine code">
        <keybind Key="T" Modifier="Ctrl" />
    </control>
    <control Name="cycle lower left display">
        <keybind Key="C" Modifier="None" />
    </control>

    <control Name="progress program">
        <keybind Key="D" Modifier="None" />
    </control>
    <control Name="progress program fast">
        <keybind Key="D" Modifier="Shift" />
    </control>
    <control Name="regress program">
        <keybind Key="A" Modifier="None" />
    </control>
    <control Name="regress program fast">
        <keybind Key="A" Modifier="Shift" />
    </control>
</controls>
